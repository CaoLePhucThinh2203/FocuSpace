<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FocuSpace — Căn phòng pixel để học tập Lo-fi</title>
    <meta
      name="description"
      content="FocuSpace: căn phòng pixel art có sẵn bàn học, âm thanh không gian 2D, Pomodoro và hẹn giờ ngủ. Vào là học được ngay."
    />
    <!-- H12 — Tuấn Hưng: ở Trang chủ, tải ảnh lớn đầu trang (LCP) ngay khi đọc HTML, không chờ React dựng trang -->
    <script>if (location.pathname === "/") { var l = document.createElement("link"); l.rel = "preload"; l.as = "image"; l.href = "/previews/room-study.webp"; l.setAttribute("fetchpriority", "high"); document.head.appendChild(l); }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- H12 — Tuấn Hưng: tải CSS font theo cách thường (chặn hiển thị, ~1 lượt mạng nhờ preconnect) để trình duyệt biết @font-face ngay từ lần vẽ đầu.
         Trước đây dùng mẹo media="print" (tải sau): chữ vẽ bằng font hệ thống trước, CSS font về sau mới khai báo Be Vietnam Pro → chữ đổi font, trang nhảy (CLS 0,327 "Phông chữ trên web đã tải").
         display=optional: font không kịp trong ~100 ms thì giữ font hệ thống cho cả lần xem đó, không đổi giữa chừng. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=optional" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
