<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FocuSpace — Căn phòng pixel để học tập Lo-fi</title>
    <meta
      name="description"
      content="FocuSpace: căn phòng pixel art có sẵn bàn học, âm thanh không gian 2D, Pomodoro và hẹn giờ ngủ. Vào là học được ngay."
    />
    <!-- H12 — Tuấn Hưng: ở Trang chủ, tải ảnh lớn đầu trang (LCP) ngay khi đọc HTML, không chờ React dựng trang -->
    <script>if (location.pathname === "/") { var l = document.createElement("link"); l.rel = "preload"; l.as = "image"; l.href = "/previews/room-study.webp"; l.setAttribute("fetchpriority", "high"); document.head.appendChild(l); }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- H12 — Tuấn Hưng: font tải không chặn hiển thị; display=optional: font về muộn thì giữ font hệ thống, không đổi giữa chừng làm nhảy bố cục (CLS) (Lighthouse: Render-blocking requests): chữ hiện ngay bằng font hệ thống rồi đổi sang Be Vietnam Pro -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=optional" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=optional" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=optional" /></noscript>
