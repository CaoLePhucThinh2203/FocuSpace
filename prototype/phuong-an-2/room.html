<style type="text/tailwindcss">
/* Phương án 2 — toàn bộ CSS của Căn phòng viết lại bằng Tailwind CSS v4.
   Biến màu đổi theo phòng (body[data-room]) nên theme dùng "@theme inline" trỏ tới biến CSS.
   Lớp thành phần (pop, seg, switch…) giữ tên cũ vì script tạo và đổi chúng lúc chạy; nội dung lớp viết bằng @apply. */
@theme inline {
  --color-bg: var(--bg); --color-panel: var(--panel); --color-panel-2: var(--panel-2); --color-line: var(--line);
  --color-ink: var(--text); --color-muted: var(--muted); --color-amber: var(--amber); --color-amber-ink: var(--amber-ink);
  --color-rain: var(--rain); --color-danger: var(--danger); --color-ok: var(--ok); --color-deep: var(--deep); --color-deep2: var(--deep2);
  --color-panel-a: var(--panel-a); --color-shadow: var(--shadow); --color-on-bg: var(--on-bg);
  --font-pixel: "Pixelify Sans", "Courier New", monospace;
  --font-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "VT323", "Courier New", monospace;
  --font-logo: "Press Start 2P", "Pixelify Sans", "Courier New", monospace;
}

@layer base {
  :root {
    --bg:#16100d; --panel:#211712; --panel-2:#2b1e17; --line:#3e2c21; --text:#f2e4cf; --muted:#b49b81;
    --amber:#f3a84b; --amber-ink:#2a1606; --rain:#8fb3d9; --danger:#e0705a; --ok:#8fd49a;
    --deep:#120c09; --deep2:#1a120e; --panel-a:rgba(33,23,18,.94); --shadow:#0b0806; --on-bg:#3d2a12;
    color-scheme: dark;
  }
  body[data-room="bed"] {
    --bg:#0e0a1c; --panel:#171230; --panel-2:#1f173b; --line:#32285c; --text:#e9e4f7; --muted:#9d96c4;
    --amber:#F7D070; --amber-ink:#1d1436; --deep:#0c0818; --deep2:#120d26; --panel-a:rgba(23,18,48,.94); --shadow:#06030f; --on-bg:#3a2f12;
  }
  body[data-room="out"] {
    --bg:#0d1612; --panel:#15251d; --panel-2:#1c3128; --line:#2f5242; --text:#e8f3e2; --muted:#9bbba6;
    --amber:#f2c14e; --amber-ink:#1d2a0a; --deep:#0a120e; --deep2:#101c16; --panel-a:rgba(21,37,29,.94); --shadow:#050a07; --on-bg:#3a3a12;
  }
  html, body { @apply h-full; }
  body {
    @apply m-2 bg-bg text-ink font-ui text-[14px] leading-[1.45] overflow-hidden
           pl-[max(16px,env(safe-area-inset-left,0px))] pr-[max(16px,env(safe-area-inset-right,0px))]
           max-[720px]:overflow-auto;
  }
  [hidden] { display: none !important; }
  :focus-visible { @apply outline-2 outline-solid outline-amber outline-offset-2; }
  input[type=range] { @apply m-[2px] w-full accent-amber; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
}

  /* Thanh công cụ + khay */
  .toolbar { @apply z-30 flex flex-row items-center gap-[6px] border border-line bg-panel-a p-1 shadow-[3px_3px_0_var(--shadow),0_10px_24px_rgba(0,0,0,.45)] backdrop-blur-[6px]; }

  .tb-btn { @apply relative grid size-[42px] cursor-pointer place-items-center px-[6px] py-px border border-transparent bg-panel-2 text-ink hover:border-amber; }

  /* Sân khấu phòng */
  .room { @apply relative touch-none overflow-hidden bg-[#0d0907] shadow-[0_0_0_3px_#0d0907,0_0_0_5px_var(--line),0_18px_40px_rgba(0,0,0,.5)]; }
  .room canvas.layer { @apply absolute inset-0 size-full; image-rendering: pixelated; }

  .obj:hover, .obj:focus-visible { filter: drop-shadow(1px 0 0 var(--amber)) drop-shadow(-1px 0 0 var(--amber)) drop-shadow(0 1px 0 var(--amber)) drop-shadow(0 -1px 0 var(--amber)); }
  .obj.dragging { @apply cursor-grabbing; filter: drop-shadow(0 6px 4px rgba(0,0,0,.45)); }
  .obj canvas { @apply pointer-events-none block size-full; image-rendering: pixelated; }
  .meow { @apply pointer-events-none absolute bottom-full left-[-6px] mb-1 whitespace-nowrap border border-line bg-panel px-[7px] py-[2px] text-[12px] font-bold text-ink shadow-[2px_2px_0_var(--shadow)] animate-[meowPop_1.4s_steps(7)_forwards]; }
  .hot { @apply absolute z-[1] cursor-pointer border border-dashed border-transparent bg-none p-0 hover:border-[rgba(243,168,75,.85)] focus-visible:border-[rgba(243,168,75,.85)] focus-visible:outline-none; }
  .hot .tag, .nav-door .tag { @apply pointer-events-none absolute left-1/2 -translate-x-1/2 whitespace-nowrap border border-line bg-panel px-[6px] py-px text-[11px] opacity-0 transition-opacity duration-150; }
  .hot .tag { @apply top-[-22px]; }
  .nav-door .tag { @apply top-[-24px] text-ink; }
  .hot:hover .tag, .hot:focus-visible .tag, .nav-door:hover .tag, .nav-door:focus-visible .tag { @apply opacity-100; }
  .nav-arrow { @apply relative z-[60] row-start-1 flex h-[clamp(48px,7vw,76px)] w-[clamp(34px,4.2vw,52px)] cursor-pointer items-center justify-center self-center border-2 border-amber bg-panel-a p-0 text-amber shadow-[3px_3px_0_var(--shadow)] hover:bg-amber hover:text-amber-ink focus-visible:bg-amber focus-visible:text-amber-ink max-[720px]:w-10; }
  .nav-arrow svg { @apply h-auto w-[55%]; }
  .nav-arrow.l { @apply col-start-1 justify-self-start; }
  .nav-arrow.r { @apply col-start-3 justify-self-end; }

  .fade { @apply pointer-events-none fixed inset-0 z-50 bg-[#05030d] opacity-0 transition-opacity duration-300 ease-[ease]; }
  .fade.on { @apply pointer-events-auto opacity-100; }

  /* Kéo thả: đồng hồ trái/phải, bóng đồ vật */
  .drag-meter { @apply pointer-events-none fixed z-[900] grid min-w-[150px] gap-1 border border-line bg-panel px-2 py-1 text-[11px]; }

  .lbl { @apply text-[12px] text-muted; }
  .seg { @apply grid grid-cols-[repeat(auto-fit,minmax(0,1fr))] border border-line; }
  .seg button { @apply cursor-pointer border-0 border-r border-line bg-panel-2 px-1 py-[7px] text-[12px] last:border-r-0; }

  .seg.cols2 { @apply grid-cols-2; }
  .seg.cols2 button { @apply border-b border-line even:border-r-0 nth-last-[-n+2]:border-b-0; }
  .switch { @apply relative h-[22px] w-[42px] flex-none cursor-pointer border border-line bg-deep p-0 after:absolute after:top-[3px] after:left-[3px] after:size-[14px] after:bg-muted after:transition-[left] after:duration-150 after:content-['']; }
  .switch[aria-checked="true"] { @apply border-amber bg-on-bg after:left-[23px] after:bg-amber; }
  .vol { @apply grid gap-1; }
  .vol .row span:last-child { @apply text-[12px] tabular-nums; }
  .spatial { @apply grid gap-[6px] border-t border-dashed border-line pt-[10px] text-[11px] text-muted; }
  .section { @apply grid gap-3 border-t border-dashed border-line pt-3; }
  .pomo-box { @apply grid gap-2 border border-line bg-deep2 p-[10px]; }
  .pomo-box .big { @apply text-center font-num text-[44px] leading-[.9] tabular-nums text-amber; }
  .pomo-box .actions { @apply grid grid-cols-2 gap-[6px]; }

}

</style>

<script>
(() => {
"use strict";
/* ============================================================
   HẰNG SỐ PHÒNG (đơn vị: pixel logic của căn phòng 320×180)
   ============================================================ */
const W = 320, H = 180;
const LISTENERS = { study: { x: 160, y: 100 }, bed: { x: 286, y: 92 }, out: { x: 160, y: 100 } };   // Audio Listener: tâm nhân vật (phòng học) / chiếc gối (phòng ngủ) / người ngồi xích đu (sân vườn)
const X0 = 160, Y0 = 100;
const D_MAX = Math.hypot(W, H);         // đường chéo phòng
const W_HALF = W / 2;
const DESK = { x0: 92, x1: 228, top: 115, front: 158 }; // bàn hộp: mặt bàn y=115, thân bàn tới y=158
const FLOOR_MIN_BASE = 112, FLOOR_MAX_BASE = H - 2;
const STORAGE_KEY = "focuspace.room.v4";   // v6: khóa lưu mới để lần mở đầu thấy bàn học chỉ có đèn + ly cà phê

    const bed = cfg.list().find(i => i.type === "catbed" && cx >= i.x - 4 && cx <= i.x + TYPES.catbed.w + 4 && Math.abs(base - (i.y + TYPES.catbed.h)) <= 14);

function toLogical(e) { const r = room.getBoundingClientRect(); return [(e.clientX - r.left) / S, (e.clientY - r.top) / S]; }

  });

    const [lx, ly] = toLogical(e);
    o.data.x = lx - off[0]; o.data.y = ly - off[1]; clampPos(o.data); placeObj(o); syncCats(o);

}

    pomoSetMode(pomo.mode === "focus" ? "break" : "focus");

  }

}, 250);

/* Hẹn giờ ngủ: 15/30/45/60 phút. Hai phút cuối, toàn bộ âm thanh nhỏ dần đều về 0 rồi dừng hẳn. */
const sleep = { min: 0, endAt: 0 };
function renderSleep() {
  const el = $("sleepMini"), rem = sleep.endAt ? Math.max(0, Math.ceil((sleep.endAt - Date.now()) / 1000)) : 0;
  el.querySelectorAll("[data-sl]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.sl === sleep.min)));
  $("sleepTime").textContent = sleep.endAt ? fmt(rem) : "--:--";
  el.classList.toggle("fading", !!sleep.endAt && rem <= 120);
}
function sleepSet(min) { sleep.min = min; sleep.endAt = min ? Date.now() + min * 60000 : 0; if (ctx) ramp(fade.gain, 1, 0.2); renderSleep(); }

      }).catch(() => {}), 150);
    }

  } else if (key === "bedlamp") {

    bind = () => bindSwitch("bOn", () => state.bed.lampOn, v => { state.bed.lampOn = v; playClick(); });
  } else if (key === "headphone") {
    const isH = true, st = state.headphone, em = headEm, apply = applyHeadphone;
    html = head(isH ? "Tai nghe" : "Radio", isH ? "Nhạc Lo-fi phát thẳng vào tai nghe." : "Nhạc Lo-fi từ chiếc radio trong tủ đầu giường.") +
      sw("rOn", st.on, isH ? "Phát nhạc" : "Bật radio") + volRow("rVol", st.vol) +
      `<div class="row"><span class="lbl">Bài Lo-fi</span></div><div class="seg" role="group" aria-label="Chọn bài">${LOFI.map((l, i) => `<button type="button" data-t="${i}" aria-pressed="${(st.track | 0) === i}">Bài ${i + 1} · ${l.bpm}</button>`).join("")}</div>` +
      (isH ? "" : spatialRow(em));
    bind = () => {
      bindSwitch("rOn", () => st.on, v => { st.on = v; apply(); });
      bindVol("rVol", v => { st.vol = v; em.setLevel(st.on, v); });
      pop.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => {
        st.track = +b.dataset.t; apply(); save();
        pop.querySelectorAll("[data-t]").forEach(x => x.setAttribute("aria-pressed", x === b));
      }));
    };
  } else if (key === "wallclock") {
    const wc = state.bed.clock;
    html = head("Đồng hồ treo tường", "Chiếc đồng hồ kim quay đều, chỉ để trang trí.") + sw("wcOn", wc.on, "Tiếng tích tắc") + volRow("wcVol", wc.vol);
    bind = () => {
      bindSwitch("wcOn", () => wc.on, v => { wc.on = v; applyWallClock(); });
      bindVol("wcVol", v => { wc.vol = v; applyWallClock(); });
    };
  } else if (key === "fireplace") {
    html = head("Lò sưởi", "Tiếng củi khô nổ lách tách.") + sw("fOn", state.fireOn, "Đốt lửa") + volRow("fVol", state.fireVol)  + `<div class="section"><h4>Vị trí lò sưởi</h4><div class="seg cols2"><button id="fSideL" aria-pressed="${state.fireSide === "left"}">Bên trái</button><button id="fSideR" aria-pressed="${state.fireSide !== "left"}">Bên phải</button></div></div>`;
    bind = () => {
      [["fSideL", "left"], ["fSideR", "right"]].forEach(([id, v]) => pop.querySelector("#" + id).addEventListener("click", () => { state.fireSide = v; applyFire(); redrawBg(); buildHotspots(); layout(); save(); closePop(); }));
      bindSwitch("fOn", () => state.fireOn, v => { state.fireOn = v; applyFire(); });
      bindVol("fVol", v => { state.fireVol = v; applyFire(); });
    };
  } else if (key === "rug") {
    const bed = ROOM.cur === "bed", list = bed ? RUGS : STUDY_RUGS, cur = bed ? state.rug : state.studyRug;
    html = head("Thảm", bed ? "Chọn họa tiết thảm dưới giường." : "Chọn họa tiết thảm dưới bàn.") + `<div class="seg cols2">${list.map((r, i) => `<button id="rug${i}" aria-pressed="${cur === i}">${r.n}</button>`).join("")}</div>`;
    bind = () => list.forEach((r, i) => pop.querySelector("#rug" + i).addEventListener("click", () => { if (bed) state.rug = i; else state.studyRug = i; redrawBg(); save(); const a = popAnchor; closePop(); openPop("rug", a); }));
  } else if (o.data.type === "lamp") {
    html = head("Đèn bàn", "Ánh sáng vàng ấm chiếu xuống trang sách. Kéo để dời dọc mặt bàn.") + sw("lOn", state.lampOn, "Bật đèn");
    bind = () => bindSwitch("lOn", () => state.lampOn, v => { state.lampOn = v; playClick(); });
  } else if (o.data.type === "clock") {
    const d = o.data;
    html = head("Đồng hồ Pomodoro", "Đếm giờ Focus/Nghỉ, đồng bộ với Pomodoro ở góc trên. Kéo lên giá hoặc đặt lên bàn.") + sw("iOn", d.on, "Tiếng tích tắc") + volRow("iVol", d.vol) + `<div class="section"><h4>Pomodoro</h4>${pomoBox()}</div><button type="button" class="btn danger" id="iDel">Xóa khỏi phòng</button>`;
    bind = () => {
      bindSwitch("iOn", () => d.on, v => { d.on = v; applyItemAudio(o); });
      bindVol("iVol", v => { d.vol = v; o.em.setLevel(d.on, v); });
      bindPomo();
      pop.querySelector("#iDel").addEventListener("click", () => removeItem(d.id));
    };
  } else if (!TYPES[o.data.type].sound) {
    const d = o.data, t = TYPES[d.type];
    html = head(t.name, d.type === "frame" ? "Mỗi khung ảnh có một bức tranh pixel ngẫu nhiên." : "Đồ trang trí, không phát âm thanh.") + (d.type === "frame" ? `<button type="button" class="btn" id="iArt">Đổi bức tranh khác</button> ` : "") + `<button type="button" class="btn danger" id="iDel">Xóa khỏi phòng</button>`;
    bind = () => {
      pop.querySelector("#iDel").addEventListener("click", () => removeItem(d.id));
      const ba = pop.querySelector("#iArt"); if (ba) ba.addEventListener("click", () => { d.art = (d.art + 1 + (Math.random() * (ART_N - 1) | 0)) % ART_N; drawItemSprite(o); save(); });
    };
  } else {
    const d = o.data, t = TYPES[d.type];
    const onLabel = { tv: "Bật tivi", headphone: "Phát nhạc", cat: "Tiếng rù rù", diffuser: "Bật máy xông", vinyl: "Phát đĩa than", musicbox: "Lên dây cót", fan: "Bật quạt", radio: "Bật radio" }[d.type];
    const tracks = d.type === "headphone" || d.type === "radio" ? LOFI : d.type === "vinyl" ? SLEEP_LOFI : null;
    html = head(t.name, t.sub + ".") + sw("iOn", d.on, onLabel) + volRow("iVol", d.vol);
    if (tracks) html += `<div class="row"><span class="lbl">${d.type === "vinyl" ? "Đĩa Lofi Sleep" : "Bài Lo-fi"}</span></div><div class="seg" role="group" aria-label="Chọn bài">${tracks.map((l, i) => `<button type="button" data-t="${i}" aria-pressed="${(d.track | 0) === i}">Bài ${i + 1} · ${l.bpm}</button>`).join("")}</div>`;
    html += spatialRow(o.em) + `<button type="button" class="btn danger" id="iDel">Xóa khỏi phòng</button>`;
    bind = () => {
      bindSwitch("iOn", () => d.on, v => { d.on = v; applyItemAudio(o); });
      bindVol("iVol", v => { d.vol = v; o.em.setLevel(d.on, v); });
      pop.querySelector("#iDel").addEventListener("click", () => removeItem(d.id));
      pop.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => {
        d.track = +b.dataset.t; applyItemAudio(o); save();
        pop.querySelectorAll("[data-t]").forEach(x => x.setAttribute("aria-pressed", x === b));
      }));
    };
  }
  pop.innerHTML = html;
  document.body.appendChild(pop);
  pop.querySelector(".x").addEventListener("click", closePop);
  bind();
  const a = anchor.getBoundingClientRect(), p = pop.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
  let x = a.right + 12; if (x + p.width > vw - 8) x = a.left - p.width - 12; if (x < 8) x = clamp(a.left + a.width / 2 - p.width / 2, 8, vw - p.width - 8);
  let y = clamp(a.top + a.height / 2 - p.height / 2, 8, Math.max(8, vh - p.height - 8));
  pop.style.left = x + "px"; pop.style.top = y + "px";
}

/* ============================================================
   CHUYỂN PHÒNG (Room Switcher)
   ============================================================ */
const roomNav = $("roomNav"), fadeEl = $("fade");
const ICON_MOON = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/><rect x="16" y="3" width="2" height="2"/><rect x="19" y="7" width="1" height="1"/></svg>`;
const ICON_BOOK = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H3z"/><path d="M21 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg>`;
const ICON_TREE = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a6 6 0 0 0-5.6 8.1A4.5 4.5 0 0 0 7.5 19H11v3h2v-3h3.5a4.5 4.5 0 0 0 1.1-8.9A6 6 0 0 0 12 2z"/></svg>`;
const ICON_HOME = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/><rect x="16" y="4" width="2" height="4"/></svg>`;
const NAV = [["bed", "Phòng ngủ yên tĩnh", ICON_MOON], ["study", "Góc học tập ấm áp", ICON_BOOK], ["out", "Sân vườn", ICON_TREE]];
roomNav.innerHTML = NAV.map(([k, l, ic]) => `<button type="button" class="tb-btn" data-go="${k}" aria-label="${l}" aria-pressed="false">${ic}<span class="tb-tip">${l}</span></button>`).join("");
roomNav.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => switchRoom(b.dataset.go)));
function renderRoomUI() {
  const cur = ROOM.cur, out = cur === "out";
  document.body.dataset.room = cur;
  $("roomName").textContent = ROOMCFG[cur].name;
  document.querySelector(".pomo-mini").hidden = cur === "bed";   // phòng học + sân vườn dùng chung Pomodoro
  $("sleepMini").hidden = cur !== "bed";
  toolbar.querySelectorAll("[data-tray]").forEach(b => { const k = b.dataset.tray; b.hidden = out ? (k === "sound" || k === "decor") : k === "scene"; });
  roomNav.querySelectorAll("[data-go]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.go === cur)));
  closeTray(); updateMix();
}
function renderSceneMini() { document.querySelectorAll("[data-sc]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sc === state.out.scene))); }
function setScene(id) {
  if (!SCENE_IDS.includes(id) || id === state.out.scene) return;
  state.out.scene = id;
  drawOutBackdrop(); applyScene(); renderSceneMini();
  const sub = document.getElementById("scSub"); if (sub) sub.textContent = SCENES.find(s => s.id === id).sub;
  save();
}
function setupRoom() {
  renderRoomUI();
  applyFire(); redrawBg();
  buildHotspots();
  ROOMCFG[ROOM.cur].list().forEach(spawn);
  layout();
  an.clearRect(0, 0, W, H); li.clearRect(0, 0, 160, 90); tick();   // xóa khung hình/ánh sáng của phòng trước, vẽ ngay phòng mới (hết dư ảnh)
}
function teardownRoom() {
  itemsById.forEach(o => { o.el.remove(); if (o.em) o.em.destroy(); });
  itemsById.clear(); lampObj = null;
}

/* ---------- Mũi tên đi giữa các phòng (Phòng ngủ ← Phòng học → Sân vườn; bấm cửa nhà để vào) ---------- */
const NAVS = { study: [{ d: "l", to: "out", label: "Ra sân vườn" }, { d: "r", to: "bed", label: "Sang phòng ngủ" }], bed: [{ d: "l", to: "study", label: "Về phòng học" }], out: [{ door: true, to: "study", label: "Vào phòng học" }] };
function buildNav() {
  document.querySelectorAll(".nav-arrow,.nav-door").forEach(n => n.remove());
  (NAVS[ROOM.cur] || []).forEach(n => {
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", n.label);
    if (n.door) { b.className = "nav-door"; b.innerHTML = `<span class="tag">${n.label}</span>`; }
    else { b.className = "nav-arrow " + n.d; b.innerHTML = `<svg viewBox="0 0 6 10" fill="currentColor" shape-rendering="crispEdges">${n.d === "l" ? '<path d="M4 0h2v2H4zM2 2h2v2H2zM0 4h2v2H0zM2 6h2v2H2zM4 8h2v2H4z"/>' : '<path d="M0 0h2v2H0zM2 2h2v2H2zM4 4h2v2H4zM2 6h2v2H2zM0 8h2v2H0z"/>'}</svg><span class="tag">${n.label}</span>`; }
    b.addEventListener("click", e => { e.stopPropagation(); switchRoom(n.to); });
    (n.door ? roomEl : document.querySelector(".main")).appendChild(b);
  });
}
const roomEl = document.getElementById("room");
function switchRoom(to) {
  if (to === ROOM.cur || ROOM.busy) return;
  ROOM.busy = true; closePop(); closeTray(); sleepCancel();
  if (to !== "out") state.lastIndoor = to; else if (ROOM.cur !== "out") state.lastIndoor = ROOM.cur;   // nhớ phòng trong nhà gần nhất để vào lại
  if (ctx) { ramp(roomOut[ROOM.cur].gain, 0, 0.3); ramp(roomOut[to].gain, 1, 0.3); }   // cross-fade âm thanh nền
  fadeEl.classList.add("on");                                                          // mờ tối 0.3s
  setTimeout(() => {
    teardownRoom(); ROOM.cur = to; state.room = to; setupRoom(); buildNav(); save();
    fadeEl.classList.remove("on");
    setTimeout(() => { ROOM.busy = false; }, 320);
  }, 320);
}
setTimeout(() => { SCENE_IDS.forEach((id, i) => setTimeout(() => sceneBuf(id), 300 * (i + 1))); }, 1500);   // dựng sẵn âm thanh các cảnh còn lại, mỗi cảnh một nhịp để không giật

/* ============================================================
   KHỞI ĐỘNG
   ============================================================ */
renderPomo(); renderSleep();
setupRoom(); buildNav();
requestAnimationFrame(loop);
// Nhạc Lo-fi render nền (OfflineAudioContext) rồi gắn vào các headphone / đĩa than đang có
if (ctx) {
  LOFI.reduce((p, def, i) => p.then(() => renderLofi(def, i).then(b => { BUF.lofi[i] = b; applyHeadphone(); applyRadio(); })), Promise.resolve()).catch(() => {});
  SLEEP_LOFI.reduce((p, def, i) => p.then(() => renderLofi(def, 10 + i).then(b => { BUF.sleepLofi[i] = addCrackle(b); itemsById.forEach(o => { if (o.data.type === "vinyl") applyItemAudio(o); }); })), Promise.resolve()).catch(() => {});
}
// Hook kiểm thử
window.__focuspace = { spatial, state, D_MAX, W_HALF, LISTENERS, itemsById, windowEm, bedWindowEm, sceneEm, outHeadEm, setScene, sceneBuf, roomOut, fade, sleep, ROOM, switchRoom,
  sleepRemaining: s => { sleep.endAt = Date.now() + s * 1000; } };
})();
</script>
<script>
/* Menu các trang ở logo (PRD Tính năng J) */
(function () {
  var btn = document.getElementById("logoBtn"), menu = document.getElementById("siteMenu");
  menu.innerHTML = FS.PAGES.map(function (p) {
    return '<a href="' + p.href + '"' + (p.id === "room" ? ' aria-current="page"' : "") + ' class="px-[10px] py-[7px] text-[13px] text-ink [&[aria-current]]:text-amber hover:bg-panel-2 hover:text-amber focus-visible:bg-panel-2 focus-visible:text-amber">' + p.label + "</a>";
  }).join("");
  function set(open) { menu.hidden = !open; btn.setAttribute("aria-expanded", String(open)); }
  btn.addEventListener("click", function () { set(menu.hidden); });
  document.addEventListener("pointerdown", function (e) { if (!menu.hidden && !menu.contains(e.target) && !btn.contains(e.target)) set(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !menu.hidden) { set(false); btn.focus(); } });
})();
</script>
