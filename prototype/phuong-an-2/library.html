<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thư viện đồ vật và khung cảnh — FocuSpace</title>
<meta name="description" content="Danh mục 17 đồ vật và 5 khung cảnh của FocuSpace, lọc theo phòng và nhóm âm thanh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&display=swap">
<script src="assets/site.js"></script>
<script src="assets/catalog.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body data-page="library">
<header id="site-nav"></header>

<main class="mx-auto max-w-6xl px-4 py-10">
  <h1 class="font-display text-3xl font-bold">Thư viện</h1>
  <p class="mt-2 text-muted">Đồ vật và khung cảnh có trong FocuSpace. Bản chính thức đọc từ cơ sở dữ liệu qua <code class="text-ink">GET /catalog/items</code> và <code class="text-ink">GET /catalog/scenes</code>.</p>

  <div class="mt-6 flex gap-1 border-b border-line" role="tablist" aria-label="Loại danh mục">
    <button type="button" role="tab" id="tab-items" aria-controls="panel-items" class="tab -mb-px border-b-2 px-4 py-2 font-semibold">Đồ vật</button>
    <button type="button" role="tab" id="tab-scenes" aria-controls="panel-scenes" class="tab -mb-px border-b-2 px-4 py-2 font-semibold">Khung cảnh</button>
  </div>

  <section id="panel-items" role="tabpanel" aria-labelledby="tab-items" class="mt-6">
    <form id="filters" class="flex flex-wrap items-end gap-4" aria-label="Bộ lọc đồ vật">
      <label class="grid gap-1 text-xs text-muted">Phòng
        <select name="room" class="field w-48">
          <option value="">Tất cả</option>
          <option value="study">Phòng học</option>
          <option value="bed">Phòng ngủ</option>
        </select>
      </label>
      <label class="grid gap-1 text-xs text-muted">Nhóm
        <select name="group" class="field w-48">
          <option value="">Tất cả</option>
          <option value="sound">Phát âm thanh</option>
          <option value="decor">Trang trí</option>
          <option value="desk">Trên bàn</option>
        </select>
      </label>
      <p id="count" class="pb-2 text-sm text-muted" aria-live="polite"></p>
    </form>
    <div id="items" class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-4" aria-busy="true"></div>
  </section>

  <section id="panel-scenes" role="tabpanel" aria-labelledby="tab-scenes" class="mt-6" hidden>
    <div id="scenes" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-busy="true"></div>
  </section>
</main>

<footer id="site-footer"></footer>

<script>
(function () {
  "use strict";
  var C = window.FS_CATALOG, esc = FS.esc;
  var GROUP = { sound: "Phát âm thanh", decor: "Trang trí", desk: "Trên bàn" };
  var ROOM = { study: "Phòng học", bed: "Phòng ngủ" };
  var $ = function (id) { return document.getElementById(id); };
  var form = $("filters");

  /* Giả lập GET /catalog/items?room=&group= */
  function getItems(room, group) {
    return FS.fakeFetch(function () {
      var items = C.items.filter(function (i) { return (!room || i.rooms.indexOf(room) >= 0) && (!group || i.group === group); });
      return { items: items, total: items.length };
    });
  }
  function getScenes() { return FS.fakeFetch(function () { return { scenes: C.scenes, total: C.scenes.length }; }); }

  function skeleton(n) {
    return Array.from({ length: n }, function () { return '<div class="card h-56 animate-pulse bg-panel-2"></div>'; }).join("");
  }
  function itemCard(i) {
    var k = Math.min(4, 96 / i.width, 96 / i.height);   // phóng to hình pixel, tối đa ×4
    return '<article class="card flex flex-col p-4">' +
      '<div class="grid h-28 place-items-center bg-deep"><img src="assets/previews/item-' + i.code + '.png" alt="" width="' + Math.round(i.width * k) + '" height="' + Math.round(i.height * k) + '" class="pixel" loading="lazy"></div>' +
      '<h2 class="mt-3 font-display text-lg font-bold">' + esc(i.name) + "</h2>" +
      '<p class="min-h-5 text-muted">' + (i.description ? esc(i.description) : "Đồ trang trí, không phát âm thanh") + "</p>" +
      '<div class="mt-3 flex flex-wrap gap-1.5">' +
        '<span class="chip ' + (i.group === "sound" ? "text-amber" : "") + '">' + GROUP[i.group] + "</span>" +
        i.rooms.map(function (r) { return '<span class="chip">' + ROOM[r] + "</span>"; }).join("") +
        '<span class="chip">' + i.width + "×" + i.height + "</span>" +
      "</div>" +
      (i.removable ? "" : '<p class="mt-2 text-xs text-muted">Cố định trên bàn, không xóa được.</p>') +
    "</article>";
  }
  function sceneCard(s) {
    return '<article class="card overflow-hidden">' +
      '<img src="assets/previews/scene-' + s.code + '.webp" alt="Khung cảnh ' + esc(s.name) + '" width="320" height="180" loading="lazy" class="pixel block aspect-video h-auto w-full">' +
      '<div class="p-4"><h2 class="flex items-center gap-2 font-display text-lg font-bold">' + esc(s.name) +
      (s.isDefault ? '<span class="chip text-amber">Mặc định</span>' : "") + "</h2>" +
      '<p class="text-muted">' + esc(s.description) + "</p></div></article>";
  }

  var reqId = 0;
  function loadItems() {
    var room = form.room.value, group = form.group.value, my = ++reqId, box = $("items");
    box.setAttribute("aria-busy", "true"); box.innerHTML = skeleton(4); $("count").textContent = "Đang tải…";
    getItems(room, group).then(function (res) {
      if (my !== reqId) return;   // bỏ kết quả cũ khi người dùng đổi lọc liên tục
      box.setAttribute("aria-busy", "false");
      box.innerHTML = res.total ? res.items.map(itemCard).join("") : '<p class="col-span-full card p-6 text-center text-muted">Không có đồ vật phù hợp.</p>';
      $("count").textContent = res.total + " đồ vật";
    });
  }
  function loadScenes() {
    var box = $("scenes"); box.innerHTML = skeleton(3);
    getScenes().then(function (res) { box.setAttribute("aria-busy", "false"); box.innerHTML = res.scenes.map(sceneCard).join(""); });
  }

  function syncUrl() {
    var p = new URLSearchParams();
    if (tab === "scenes") p.set("tab", "scenes");
    if (form.room.value) p.set("room", form.room.value);
    if (form.group.value) p.set("group", form.group.value);
    history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : ""));
  }
  var tab = "items", scenesLoaded = false;
  function setTab(t) {
    tab = t;
    ["items", "scenes"].forEach(function (k) {
      var on = k === t, b = $("tab-" + k);
      b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1;
      b.className = "tab -mb-px border-b-2 px-4 py-2 font-semibold " + (on ? "border-amber text-amber" : "border-transparent text-muted hover:text-ink");
      $("panel-" + k).hidden = !on;
    });
    if (t === "scenes" && !scenesLoaded) { scenesLoaded = true; loadScenes(); }
    syncUrl();
  }

  var q = new URLSearchParams(location.search);
  if (q.get("room") in ROOM) form.room.value = q.get("room");
  if (q.get("group") in GROUP) form.group.value = q.get("group");
  form.addEventListener("change", function () { syncUrl(); loadItems(); });
  $("tab-items").addEventListener("click", function () { setTab("items"); });
  $("tab-scenes").addEventListener("click", function () { setTab("scenes"); });
  document.querySelector('[role="tablist"]').addEventListener("keydown", function (e) {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    var next = tab === "items" ? "scenes" : "items"; setTab(next); $("tab-" + next).focus();
  });
  setTab(q.get("tab") === "scenes" ? "scenes" : "items");
  loadItems();
})();
</script>
</body>
</html>
